# Keeps the Render backend awake so Octi answers straight away.
#
# Render's free plan puts the server to sleep after 15 minutes without a
# request, and the next request then waits ~20 seconds for it to start. A
# ping every 10 minutes keeps it up. Free here because the repo is public.
#
# ponytail: GitHub can run scheduled jobs late when it's busy, so the odd cold
# start can still slip through; a paid Render instance is the real fix. GitHub
# also pauses schedules after 60 days with no commits; re-enable it in the
# Actions tab if that happens.

name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        # Generous timeout and retries: a ping that lands on a sleeping server
        # is the one that wakes it, and that takes a while.
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://student-os-backend-c289.onrender.com/health
