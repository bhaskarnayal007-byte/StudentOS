# Render Blueprint for the backend (the AI proxy).
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are
# asked for in the dashboard and never live in the repo.
#
# ponytail: free plan sleeps after ~15 idle minutes, so the first Octi AI reply
# after a quiet spell takes up to a minute. Template commands ("25 min timer")
# never touch the backend and stay instant. Move to a paid plan when real
# users notice.
services:
  - type: web
    name: student-os-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      # The rotation. Free tiers are metered per model, so each entry is its
      # own 200k-token/day pool on the same key.
      - key: AI_PROVIDERS
        value: groq|https://api.groq.com/openai/v1|openai/gpt-oss-120b|AI_API_KEY,groq|https://api.groq.com/openai/v1|openai/gpt-oss-20b|AI_API_KEY,groq|https://api.groq.com/openai/v1|qwen/qwen3.8-27b|AI_API_KEY
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Your Vercel URL, e.g. https://student-os.vercel.app (no trailing slash).
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      # Total daily tokens across every model in AI_PROVIDERS, split evenly
      # across active users. Three Groq models at 200k each.
      - key: AI_DAILY_TOKENS
        value: "600000"
