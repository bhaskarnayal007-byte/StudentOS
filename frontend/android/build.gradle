// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The repo lives in OneDrive on B's machine, and OneDrive locks and
// dehydrates files under build/ while Gradle is writing them, which fails the
// build. There, every module builds into %LOCALAPPDATA%\stratus-android-build
// instead; anywhere else nothing changes.
def localBuildRoot = System.getenv('LOCALAPPDATA')
if (localBuildRoot && rootDir.path.contains('OneDrive')) {
    allprojects { p ->
        p.layout.buildDirectory = new File(localBuildRoot, "stratus-android-build/${p == p.rootProject ? 'root' : p.name}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
