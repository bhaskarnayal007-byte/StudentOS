<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + the safe-area padding in theme.css keeps content
         clear of the notch when installed on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E5334" />
    <meta name="author" content="Bhaskar Nayal" />
    <meta name="copyright" content="© 2026 Bhaskar Nayal" />

    <!-- Same font as the spec's @import, loaded via <link> instead: an
         @import inside CSS blocks rendering until it resolves, whereas these
         start downloading in parallel with the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap"
    />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Student OS</title>
  </head>
  <body>
    <!-- React draws the entire app inside this one empty div. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
